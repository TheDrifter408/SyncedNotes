services:
  db:
    image: postgres:15
    container_name: notes-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-notesdb}
    # No exposed ports — only reachable from the internal network
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notesdb}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runner
    container_name: notes-app-prod
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-notesdb}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TOKEN_MAX_AGE: ${JWT_ACCESS_TOKEN_MAX_AGE:-900000}
      JWT_REFRESH_TOKEN_MAX_AGE: ${JWT_REFRESH_TOKEN_MAX_AGE:-604800000}
      PORT: '3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_prod:
